          <h1>Bidirectional Real-Time Chat &amp; Video Calling Application</h1>
          <p>
            Developed by <strong>Gaurav Chavda</strong>, this high-performance full-stack web application provides instant messaging, collaborative group chat rooms, WebRTC video calling, live presence indicators, and live monitoring.
          </p>

          <section>
            <h2>Core Platform Features</h2>
            <ul>
              <li><strong>Instant Messaging:</strong> Sub-second delivery with Socket.IO, typing indicators, read receipts, and reactions.</li>
              <li><strong>WebRTC Voice &amp; Video Calls:</strong> Crystal-clear peer-to-peer calling with screen sharing.</li>
              <li><strong>Group Conversations:</strong> Multi-user collaboration rooms with admin permissions and custom avatars.</li>
              <li><strong>Security &amp; Auth:</strong> Dual-token JWT session management, bcrypt encryption, Google OAuth, and OTP verification.</li>
              <li><strong>Media &amp; Voice Notes:</strong> Waveform voice recording, file sharing, and Giphy GIF search.</li>
            </ul>
          </section>

          <section>
            <h2>Technology Architecture</h2>
            <p>
              Engineered with React 18, TypeScript, Vite, Node.js, Express, Socket.IO, WebRTC, and MongoDB Atlas.
